<script>
(function () {
  'use strict';
  var P = JSON.parse(document.getElementById('payload').textContent);
  var KEY = 'learn:key:' + P.salt;             // per-encryption, so a re-publish asks again
  var form = document.getElementById('f'), input = document.getElementById('pw');
  var btn = document.getElementById('go'), err = document.getElementById('err');
  var u8 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var b64 = function (a) { var s = ''; new Uint8Array(a).forEach(function (b) { s += String.fromCharCode(b); }); return btoa(s); };

  function derive(pw) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey'])
      .then(function (base) {
        return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: u8(P.salt), iterations: P.iter },
          base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      });
  }
  function open(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(P.iv) }, key, u8(P.ct)).then(function (buf) {
      return crypto.subtle.exportKey('raw', key).then(function (raw) {
        try { sessionStorage.setItem(KEY, b64(raw)); } catch (e) {}
        var hash = location.hash;
        document.open(); document.write(new TextDecoder().decode(buf)); document.close();
        if (hash) setTimeout(function () { var el = document.getElementById(decodeURIComponent(hash.slice(1))); if (el) el.scrollIntoView(); }, 50);
      });
    });
  }
  // a key kept for this tab skips the prompt on reload
  var kept = null; try { kept = sessionStorage.getItem(KEY); } catch (e) {}
  if (kept) {
    crypto.subtle.importKey('raw', u8(kept), 'AES-GCM', true, ['decrypt']).then(open)
      .catch(function () { try { sessionStorage.removeItem(KEY); } catch (e) {} });
  }
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!window.crypto || !crypto.subtle) { err.textContent = 'This browser cannot open the page (it needs HTTPS and Web Crypto).'; return; }
    btn.disabled = true; btn.textContent = 'Opening'; err.textContent = '';
    derive(input.value).then(open).catch(function () {
      btn.disabled = false; btn.textContent = 'Open';
      err.textContent = 'That password did not work.';
      input.select();
    });
  });
})();
</script>
